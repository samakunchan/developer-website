server {
    listen 80;
    
    # Increase upload limit (default is 1MB, which breaks image uploads)
    client_max_body_size 20M;

    # Gzip Compression for better performance
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # Security Headers (Safe to keep behind NPM)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Serve static files for /cdn/projects/
    location /cdn/projects/ {
        alias /usr/share/nginx/html/shared/projects/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Serve static files for /cdn/me/
    location /cdn/me/ {
        alias /usr/share/nginx/html/shared/me/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Serve static files for /cdn/ (fallback for old URLs)
    location /cdn/ {
        alias /usr/share/nginx/html/shared/projects/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Serve static files for /cdn/temp/
    location /cdn/temp/ {
        alias /usr/share/nginx/html/shared/temp/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy all other requests to the Node.js application
    location / {
        proxy_pass http://website:3000;
        proxy_http_version 1.1;
        
        # [IMPROVED] Better header handling for NPM
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # These ensure NPM passes the REAL client IP to your Node.js app
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # [MISSING] Proxy timeouts (prevents 504 errors on long-running tasks)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
