services:
  website:
    container_name: developer-website-app-stage
    build:
      context: .
      target: runner
      args:
        - VITE_APP_NAME=${VITE_APP_NAME}
        - VITE_RECAPTCHA_SITE_KEY=${VITE_RECAPTCHA_SITE_KEY}
    restart: always
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - NODE_ENV=staging
      - SECURE_COOKIES=false
      - BAO_ADDR=http://host.docker.internal:8200
      - DOCKER=true
      - BAO_ROLE_ID=${BAO_ROLE_ID}
      - BAO_SECRET_ID=${BAO_SECRET_ID}
      - BAO_PATH=${BAO_PATH}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_USER_ENCODED=${POSTGRES_USER_ENCODED}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT_INTERNAL=${POSTGRES_PORT_INTERNAL}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_USER_NAME=${ADMIN_USER_NAME}
      - ADMIN_ROLE=${ADMIN_ROLE}
      - APP_URL_STAGING=${APP_URL_STAGING:-http://localhost:3006}
    external_links:
      - developer-website-db-stage:postgresdb

    volumes:
      - ./public/shared:/app/public/shared

  nginx:
    image: nginx:alpine
    container_name: developer-website-nginx
    restart: always
    ports:
      - '3006:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - website
