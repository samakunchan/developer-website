# ==============================================================================
# Production Docker Compose Configuration
# ------------------------------------------------------------------------------
# This configuration is optimized for a multi-project VPS environment using
# Nginx Proxy Manager (NPM) as a global reverse proxy.
# ==============================================================================

services:
  # Database Service (PostgreSQL with pgvector)
  postgresdb:
    container_name: developer-website-db-prod
    restart: always
    # NOTE: Public ports are removed to prevent host-level conflicts.
    # The database is only accessible internally within the Docker network.
    volumes:
      - postgres_website_data_prod:/var/lib/postgresql/data

  # Node.js Application (Remix/Vite/Tanstack)
  website:
    container_name: developer-website-app-prod
    build:
      context: .
      target: runner
      args:
        - VITE_APP_NAME=${VITE_APP_NAME}
        - VITE_RECAPTCHA_SITE_KEY=${VITE_RECAPTCHA_SITE_KEY}
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - BAO_ADDR=http://openbao:8200
      - DOCKER=true
      - BAO_ROLE_ID=${BAO_ROLE_ID}
      - BAO_SECRET_ID=${BAO_SECRET_ID}
      - BAO_PATH=${BAO_PATH}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_USER_ENCODED=${POSTGRES_USER_ENCODED}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT_INTERNAL=${POSTGRES_PORT_INTERNAL}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_USER_NAME=${ADMIN_USER_NAME}
      - ADMIN_ROLE=${ADMIN_ROLE}
    depends_on:
      postgresdb:
        condition: service_healthy
    networks:
      - default
      - nginx-proxy-network

  # Internal Nginx (Serves Static Assets + Proxies to Node.js)
  nginx:
    image: nginx:alpine
    container_name: developer-website-nginx-prod
    restart: always

    networks:
      - default
      - nginx-proxy-network
    volumes:
      - ./nginx/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - website

# Persistent Storage
volumes:
  postgres_website_data_prod:

# Networking
networks:
  # Shared network for Nginx Proxy Manager connectivity
  nginx-proxy-network:
    external: true
